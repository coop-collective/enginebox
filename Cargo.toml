[workspace]
resolver = "3"
members = ["packages/enginebox-*"]
exclude = ["packages/enginebox-deploy", "packages/enginebox-actions", "packages/enginebox-preparation"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
license-file = "LICENSE"
repository = "https://github.com/coop-collective/enginebox"
publish = false

[profile.release]
lto = "thin"
strip = true
