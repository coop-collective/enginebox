name: Linux build
on:
  workflow_dispatch:
    inputs:
      enginebox_sha:
        description: Exact source commit supplied by Engine Box
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ fromJSON(vars.ENGINEBOX_LINUX_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.enginebox_sha }}
          persist-credentials: false
      - name: Build and test
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix dist
          tar -czf linux-build.tar.gz -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ inputs.enginebox_sha }}
          path: |
            linux-build.tar.gz
          if-no-files-found: error
          retention-days: 7
