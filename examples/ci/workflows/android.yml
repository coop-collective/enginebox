name: Android build
on:
  workflow_dispatch:
    inputs:
      enginebox_sha:
        description: Exact source commit supplied by Engine Box
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ fromJSON(vars.ENGINEBOX_ANDROID_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.enginebox_sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test
        shell: bash
        run: |
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ inputs.enginebox_sha }}
          path: |
            app/build/outputs/apk/debug
          if-no-files-found: error
          retention-days: 7
