# Existing Incus server: reuse this pool and bridge without changing either.
# Edit names and SSH alias. Choose a NEW Engine Box project and workspace.
schema_version = 1

[host]
transport = "ssh" # ssh | local
target = "my-server"
data_dir = "/var/lib/enginebox"
install_packages = false
disk_reserve = "5GiB"
memory_reserve = "1GiB"

[incus]
project = "enginebox"
profile = "enginebox"

[storage]
mode = "existing"
pool = "workspace-pool"

[network]
mode = "existing"
name = "workspace-net"

[workspace]
name = "ebox-dev"
image = "images:ubuntu/24.04/cloud"
cpu = 4
memory = "4GiB"
disk = "30GiB"
state_disk = "8GiB" # Must exceed configured RAM by at least 1GiB
user = "agent"
uid = 1001
gid = 1001
home = "/home/agent"
path = "/workspace"
ready_timeout = 300

[agents]
install = ["codex", "cursor", "claude"]

[modules]
desktop = false
browser = true
operator_mcp = true
guest_computer_mcp = false # Requires desktop=true
ci = false # CI bootstrap is not implemented
