[package]
name = "enginebox-stream-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license-file = "LICENSE"

# This independently built container runtime does not change the host CLI workspace.
[workspace]

[dependencies]
anyhow = "1"
bytes = "1"
hex = "0.4"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
webrtc = "=0.14.0"
x11rb = { version = "0.13", features = ["xtest"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
