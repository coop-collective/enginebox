[package]
name = "enginebox-storage-layerfs"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"
publish = false
description = "Node-local LayerFS checkout storage for Engine Box"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
enginebox-core = { path = "../enginebox-core" }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
