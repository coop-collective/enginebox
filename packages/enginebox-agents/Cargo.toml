[package]
name = "enginebox-agents"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
enginebox-core = { path = "../enginebox-core" }
fs2 = "0.4"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
toml = "0.9"
