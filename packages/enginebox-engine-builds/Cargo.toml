[package]
name = "enginebox-engine-builds"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"
publish = false

[[bin]]
name = "enginebox-build"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
enginebox-agents = { path = "../enginebox-agents" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
