name: Engine Box CI dispatch qualification
on:
  workflow_dispatch:
    inputs:
      enginebox_sha:
        description: Exact source revision requested by Engine Box
        required: true
        type: string
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.enginebox_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify exact revision and environment contracts
        env:
          REQUESTED_SHA: ${{ inputs.enginebox_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          node --test packages/environment-service/test/*.test.mjs
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enginebox-dispatch-evidence
          path: evidence/
          if-no-files-found: error
