name: Build registered Linux node installer
on:
  pull_request:
    paths:
      - 'packages/enginebox-install/**'
      - 'packages/enginebox-controller/**'
      - 'packages/enginebox-core/**'
      - 'packages/enginebox-node-protocol/**'
      - '.github/workflows/linux-node.yml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test the installer in a disposable Linux filesystem
        run: |
          bash -n packages/enginebox-install/linux/install.sh.in
          docker run --rm -e ENGINEBOX_INSTALLER_TEST_CONTAINER=1 -v "$PWD:/source:ro" python:3.13-slim-bookworm@sha256:93498f36dc7e24ef233bfdf6cc17d4b8bd32d94ee737143e906460d5f5a914c5 bash /source/packages/enginebox-install/linux/test-installer.sh
      - name: Test and build the native enrollment agent
        run: |
          cargo test --locked -p enginebox-install --lib
          cargo test --locked -p enginebox-install --test contributor_worker
          cargo test --locked -p enginebox-install --test managed_host
          cargo clippy --locked -p enginebox-install --all-targets -- -D warnings
          cargo build --locked --release -p enginebox-install --bin enginebox-node
      - name: Package immutable installer and executable
        run: |
          python3 packages/enginebox-install/linux/package.py --binary target/release/enginebox-node --output .state/linux-node --tag 'linux-node-preview-${{ github.run_id }}' --commit '${{ github.sha }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-node-${{ github.sha }}
          path: .state/linux-node/
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: linux-node
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-node-${{ github.sha }}
          path: .state/linux-node
      - name: Publish a qualified installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create 'linux-node-preview-${{ github.run_id }}' .state/linux-node/* --target '${{ github.sha }}' --prerelease --title 'Registered Linux node preview ${{ github.run_id }}' --notes 'Checksum-pinned Linux x86-64 installer for a provisioned Incus host. Uses a controller-bound one-time enrollment code, private node credential, and boot-enabled systemd service. Existing VMs and configured capacity remain in place. New bare servers require the inspected host-provisioning flow first. See provenance.json and SHA256SUMS.'
