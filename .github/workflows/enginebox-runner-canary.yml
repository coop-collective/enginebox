name: Engine Box native runner canary
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run tests, verify failure cleanup, or wait for a cancellation test
        type: choice
        default: test
        options:
          - test
          - fail
          - cancel
permissions:
  contents: read
jobs:
  native-runner:
    runs-on:
      group: enginebox-ci
      labels: enginebox-linux
    timeout-minutes: 10
    steps:
      - name: Verify disposable Engine Box runner
        shell: bash
        run: |
          [[ "$RUNNER_NAME" == ebox-ci-* ]]
          printf 'Runner: %s\nOS: %s\nArchitecture: %s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Run environment service tests
        run: node --test packages/environment-service/test/*.test.mjs
      - name: Exercise selected lifecycle outcome
        env:
          CANARY_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          case "$CANARY_MODE" in
            test) echo 'Environment service tests passed on Engine Box.' ;;
            fail) echo 'Intentional failure to verify disposable runner cleanup.'; exit 42 ;;
            cancel) echo 'Waiting for the operator to cancel this canary.'; sleep 480 ;;
            *) echo 'Unknown canary mode'; exit 1 ;;
          esac
