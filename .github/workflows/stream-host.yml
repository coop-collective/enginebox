name: Qualify stream host image
on:
  pull_request:
    paths: ['packages/stream-host/**', '.github/workflows/stream-host.yml']
  push:
    branches: [main]
    paths: ['packages/stream-host/**', '.github/workflows/stream-host.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the qualified Godot image to GHCR
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: stream-host-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build locked native image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker build --platform "linux/$ARCH" --target runtime \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            -f packages/stream-host/container/Godot.Dockerfile \
            -t "enginebox-stream-host:$ARCH" packages/stream-host
      - name: Check runtime and native scene under the installation limits
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 4g --cpus 4 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777 \
            --entrypoint /usr/local/bin/enginebox-stream-host "enginebox-stream-host:$ARCH" --version
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 4g --cpus 4 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777 \
            --entrypoint /usr/local/bin/godot "enginebox-stream-host:$ARCH" \
            --headless --path /opt/enginebox/godot-check --quit-after 30
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Qualify two real browsers through TURN
        run: |
          npm install --global pnpm@12.14.0
          pnpm install --frozen-lockfile --filter '@enginebox/fleet-controller...'
          docker build --target test-runtime -t enginebox-stream-host:qualification packages/stream-host
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --memory=1g --cpus=2 \
            --entrypoint /usr/local/bin/stream-host-tests enginebox-stream-host:qualification \
            --ignored lease_watchdog
          docker build -t enginebox-stream-relay:qualification -f packages/stream-host/test/relay.Dockerfile packages/stream-host/test
          docker build -t enginebox-stream-browser:qualification -f packages/stream-host/test/browser.Dockerfile .
          STREAM_EVIDENCE_DIR="$RUNNER_TEMP/stream-evidence" node packages/stream-host/test/start-fleet.mjs
      - name: Publish immutable architecture tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          ARCH: ${{ matrix.arch }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/enginebox-stream-host"
          docker tag "enginebox-stream-host:$ARCH" "$image:$GITHUB_SHA-$ARCH"
          docker push "$image:$GITHUB_SHA-$ARCH"
          docker logout ghcr.io
  manifest:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Publish multi-platform manifest
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/enginebox-stream-host"
          docker buildx imagetools create -t "$image:$GITHUB_SHA" "$image:$GITHUB_SHA-amd64" "$image:$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:$GITHUB_SHA"
          docker logout ghcr.io
          printf 'A package administrator must enable public visibility before anonymous installation. Verify both architectures and publish the exact manifest digest in the Account release manifest.\n' >> "$GITHUB_STEP_SUMMARY"
