name: Verify native workspace
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && fromJSON(vars.ENGINEBOX_LINUX_RUNNER || '"ubuntu-24.04"') || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec cargo fmt --all --check
      - run: pnpm check
      - run: pnpm test
      - name: Verify protected dependency handoff in disposable Linux
        if: runner.os == 'Linux'
        run: pnpm test:preparation:linux
      - name: Qualify pinned CI toolchain installation on the native worker
        run: pnpm test:ci-templates
      - run: pnpm lint:rust
      - run: pnpm build
      - if: runner.os == 'Linux'
        run: pnpm fleet:smoke
      - if: runner.os == 'Linux'
        run: pnpm --filter enginebox-dashboard exec playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-diagnostics-${{ matrix.os }}
          path: packages/dashboard/test-results/
          if-no-files-found: ignore
