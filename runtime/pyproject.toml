[project]
name = "enginebox-runtime"
version = "0.1.0"
description = "Environment lifecycle and computer tools; native agent clients stay native"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.urls]
Repository = "https://github.com/coop-collective/enginebox"
Issues = "https://github.com/coop-collective/enginebox/issues"

[project.scripts]
ebox = "enginebox:main"
enginebox-mcp = "mcp_server:main"
enginebox-api = "fleet_api:main"
enginebox-fleet-mcp = "fleet_mcp:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["enginebox", "mcp_server", "fleet", "fleet_api", "fleet_mcp", "bootstrap", "bootstrap_config", "browser_tools", "templates", "warm_pool"]

[tool.setuptools.data-files]
"share/enginebox" = ["guest_setup.sh", "requirements.lock"]
